<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relationship Sorter</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f4f6f9; --grid:#dce3ee; --ink:#1b2230; --muted:#5b6577; --blue:#2552c9; --green:#13795b; --red:#c8372d; --sticky:#ffe76a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: var(--ink); display: grid; grid-template-rows: auto auto 1fr auto;
    background: var(--paper) linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
                linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px; }
  header { padding: 20px 36px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }
  h1 { font: 800 40px 'Bricolage Grotesque', sans-serif; margin: 0; letter-spacing: -0.02em; }
  .count { font: 700 20px 'JetBrains Mono', monospace; color: var(--muted); }
  .bank { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 36px 0; }
  .bank button { font: 700 22px 'JetBrains Mono', monospace; background: #fff; border: 2px solid var(--ink); border-radius: 6px; padding: 8px 18px; cursor: pointer; color: var(--ink); }
  .bank button.hit { background: var(--green); border-color: var(--green); color: #fff; }
  .bank button.miss { background: var(--red); border-color: var(--red); color: #fff; }
  .bank .legend { align-self: center; font-size: 16px; color: var(--muted); margin-left: 8px; }
  .stagearea { display: grid; place-items: center; padding: 20px 36px; }
  .card { width: min(1100px, 100%); background: var(--sticky); padding: 48px 56px; transform: rotate(-1deg);
    box-shadow: 0 18px 30px -12px rgb(27 34 48 / 0.35); }
  .who { font: 700 18px 'JetBrains Mono', monospace; margin-bottom: 14px; }
  .q { font: 700 clamp(32px, 4vw, 58px)/1.15 'Bricolage Grotesque', sans-serif; letter-spacing: -0.01em; }
  .q small { display: block; font: 400 clamp(20px, 2vw, 28px)/1.45 'Atkinson Hyperlegible', sans-serif; margin-top: 18px; }
  code { font: 600 .9em 'JetBrains Mono', monospace; }
  .a { margin-top: 30px; background: #fff; border-left: 10px solid var(--green); padding: 18px 24px; font-size: clamp(20px, 2vw, 28px); line-height: 1.4; display: none; }
  .a b { display: block; font: 800 clamp(28px, 3vw, 42px) 'Bricolage Grotesque', sans-serif; color: var(--green); }
  .card.revealed .a { display: block; }
  footer { padding: 0 36px 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 500 14px 'JetBrains Mono'; color: var(--muted); }
  footer button { font: 700 16px 'Atkinson Hyperlegible'; padding: 10px 18px; border-radius: 8px; border: 2px solid var(--ink); background: #fff; cursor: pointer; }
  footer button.go { background: var(--blue); color: #fff; border-color: var(--blue); }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Relationship Sorter</h1>
  <span class="count" id="count"></span>
</header>
<div class="bank" id="bank">
  <button type="button">1:1</button><button type="button">M:1</button><button type="button">M:M</button>
  <span class="legend">one-to-one · many-to-one · many-to-many (click one to answer)</span>
</div>
<div class="stagearea">
  <div class="card" id="card">
    <div class="who">Say it both ways · type 1:1, M:1 or M:M in chat on "go"</div>
    <div class="q" id="q"></div>
    <div class="a" id="a"></div>
  </div>
</div>
<footer>
  <button id="prev">← Back</button><button class="go" id="reveal">Reveal (space)</button><button id="next">Next →</button>
  <span>← → to move · space to reveal · first 8 cards are the core set</span>
</footer>
<script>
  // [table A, table B, question A, question B, answer, explanation]
  const Q = [
    ["tasks", "projects", "A task belongs to how many projects?", "A project has how many tasks?", "M:1",
      "A task belongs to ONE project; a project has MANY tasks. The foreign key goes on the many side: <code>tasks.project_id</code>."],
    ["users", "user_profiles", "A user has how many profiles?", "A profile belongs to how many users?", "1:1",
      "Use <code>user_profiles.user_id</code> with a UNIQUE constraint, so two profiles can't point at the same user."],
    ["tasks", "tags", "A task has how many tags?", "A tag is on how many tasks?", "M:M",
      "A junction table <code>task_tags</code> holds one row per pairing: <code>task_id</code> + <code>tag_id</code>."],
    ["recipes", "categories", "A recipe is in how many categories? (Recipe Box: \"each recipe in one category\")", "A category has how many recipes?", "M:1",
      "The story says ONE category per recipe. Foreign key on the many side: <code>recipes.category_id</code>."],
    ["students", "courses", "A student takes how many courses?", "A course has how many students?", "M:M",
      "Junction table <code>enrollments</code> (student_id, course_id). Bonus: <code>grade</code> lives there, because it belongs to the pairing."],
    ["comments", "posts", "A comment is on how many posts?", "A post has how many comments?", "M:1",
      "Foreign key on the many side: <code>comments.post_id</code>. Same shape as tasks and projects."],
    ["people", "passports", "A person holds how many passports? (in one country's records)", "A passport belongs to how many people?", "1:1",
      "Use <code>passports.person_id</code> with UNIQUE. Put the foreign key on the side that can't exist alone: no passport without a person."],
    ["recipes", "ingredients", "A recipe uses how many ingredients?", "An ingredient is in how many recipes?", "M:M",
      "Junction table <code>recipe_ingredients</code>. The amount (\"2 cups\") lives on the junction row: it describes this recipe plus this ingredient."],
    ["orders", "customers", "An order is placed by how many customers?", "A customer places how many orders?", "M:1",
      "The foreign key goes on orders: <code>orders.customer_id</code>."],
    ["movies", "actors", "A movie has how many actors?", "An actor is in how many movies?", "M:M",
      "A <code>movie_cast</code> junction table, which can carry <code>character_name</code>. (Handy for your Netflix clone.)"],
    ["users", "recipes (as favorites)", "A user saves how many recipes?", "A recipe is saved by how many users?", "M:M",
      "A junction table, <code>favorites</code> (user_id, recipe_id, saved_at). The AUTHOR of a recipe is a separate many-to-one: <code>recipes.author_id</code>."],
    ["employees", "companies", "An employee works at how many companies? (one job at a time)", "A company has how many employees?", "M:1",
      "The foreign key goes on employees: <code>employees.company_id</code>. If people could hold several jobs, it would become many-to-many. The story decides."],
    ["playlists", "songs", "A playlist has how many songs?", "A song is on how many playlists?", "M:M",
      "A junction table, <code>playlist_songs</code>, which can store <code>position</code>, the order of the songs in that playlist."],
    ["countries", "capital cities", "A country has how many capitals? (keep it simple)", "A capital belongs to how many countries?", "1:1",
      "Use <code>countries.capital_city_id</code> with UNIQUE. Rare in real apps; often it's just a column instead."],
  ]
  const NAMES = { "1:1": "One-to-one", "M:1": "Many-to-one", "M:M": "Many-to-many" }
  let i = 0
  const $ = (s) => document.querySelector(s)
  const btns = [...document.querySelectorAll('#bank button')]
  function draw() {
    const [a, b, qa, qb] = Q[i]
    $('#card').classList.remove('revealed')
    $('#q').innerHTML = `<code>${a}</code> and <code>${b}</code><small>${qa}<br>${qb}</small>`
    $('#a').innerHTML = `<b>${NAMES[Q[i][4]]}</b>${Q[i][5]}`
    $('#count').textContent = `${i + 1} / ${Q.length}`
    btns.forEach((s) => s.className = '')
  }
  function reveal(picked) {
    $('#card').classList.add('revealed')
    btns.forEach((s) => s.className = s.textContent === Q[i][4] ? 'hit' : (s.textContent === picked ? 'miss' : ''))
  }
  btns.forEach((b) => b.onclick = () => reveal(b.textContent))
  const go = (n) => { i = Math.min(Math.max(n, 0), Q.length - 1); draw() }
  $('#prev').onclick = () => go(i - 1); $('#next').onclick = () => go(i + 1); $('#reveal').onclick = () => reveal()
  addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); reveal() }
    if (e.key === 'ArrowRight') go(i + 1)
    if (e.key === 'ArrowLeft') go(i - 1)
  })
  draw()
</script>
</body>
</html>
